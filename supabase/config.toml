project_id = "yatouji-ai-hub"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://ayoubyatouji.github.io"
additional_redirect_urls = [
  "https://ayoubyatouji.github.io/**",
  "http://localhost:8000/**",
  "http://127.0.0.1:8000/**",
  "http://localhost:8123/**",
  "http://127.0.0.1:8123/**"
]

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
